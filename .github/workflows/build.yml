name: Build lists
on:
  schedule:
    - cron: "17 3 * * *"     # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from OONI
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "routelists-bot"
          git config user.email "routelists-bot@users.noreply.github.com"
          git add countries index.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Lists $(date -u +%Y-%m-%d)"
          git push
